<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📅 Kalender Abadi 2026-2100</title>
  <style>
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      margin: 0;
      padding: 10px;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
      background: #1e293b;
      padding: 10px;
      border-radius: 1rem;
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3);
    }
    header { background: transparent; padding: 0; margin-bottom: 2rem; }
    h1 { color: #38bdf8; margin: 0; font-size: 1.5rem; }
    .controls { gap: 1rem; }
    select, button {
      background: #334155;
      color: white;
      border: 1px solid #475569;
      padding: 0.5rem 1rem;
      border-radius: 0.5rem;
    }
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 4px; /* Reduced gap */
      margin-top: 20px;
    }
    .day {
      height: 42px; aspect-ratio: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 6px; /* Smaller radius */
      cursor: pointer;
      font-weight: 500;
      font-size: 12px;
      transition: all 0.2s ease;
    }
    .day:hover:not(.weekday) {
      background: #334155;
      transform: translateY(-2px);
      border-color: #38bdf8;
    }
    .weekday {
      background: transparent;
      border: none;
      color: #64748b;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .holiday {
      background: #450a0a !important;
      color: #fda4af;
      border-color: #991b1b;
    }
    .event-list { background: #0f172a; border-radius: 0.5rem; padding: 1rem; margin-top: 2rem; }
    @media (max-width: 600px) {
      body { padding: 10px; }
      .container { padding: 10px; }
      .calendar-grid { gap: 5px; }
      .day { padding: 5px; font-size: 0.8em; }
      .controls { flex-direction: column; gap: 10px; }
    }
  </style>

<style>
/* === FIX KALENDER MOBILE FINAL === */
@media screen and (max-width: 600px) {
  .calendar-grid { 
  }
  .day, th { 
  }
}
</style>
</head>
<body>
  <header>
    <h1>📅 Kalender Abadi 2026-2100</h1>
    <p>Hari libur nasional Indonesia dan perayaan internasional</p>
  </header>

  <div class="container">
    <div class="controls">
      <div>
        <select id="yearSelect"></select>
        <select id="monthSelect"></select>
      </div>
      <button id="todayBtn">Hari Ini</button>
    </div>

    <div class="calendar-grid" id="calendarGrid">
      <!-- Days will be inserted here by JavaScript -->
    </div>

    <div class="event-list" id="eventList">
      <!-- Events will be displayed here -->
    </div>
  </div>

  <script>
    // Load calendar data
    let calendarData = {};
    fetch('calendar-2027-2100.json')
      .then(response => response.json())
      .then(data => {
        calendarData = data;
        initializeCalendar();
      });

    // Initialize calendar controls
    function initializeCalendar() {
      const yearSelect = document.getElementById('yearSelect');
      const monthSelect = document.getElementById('monthSelect');
      const todayBtn = document.getElementById('todayBtn');

      // Populate year dropdown
      const currentYear = new Date().getFullYear();
      for (let year = 2026; year <= 2100; year++) {
        const option = document.createElement('option');
        option.value = year;
        option.textContent = year;
        if (year === currentYear) option.selected = true;
        yearSelect.appendChild(option);
      }

      // Populate month dropdown
      const months = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni',
                      'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
      for (let i = 0; i < 12; i++) {
        const option = document.createElement('option');
        option.value = i + 1;
        option.textContent = months[i];
        if (i + 1 === new Date().getMonth() + 1) option.selected = true;
        monthSelect.appendChild(option);
      }

      // Render calendar for current selection
      renderCalendar(currentYear, new Date().getMonth() + 1);

      // Event listeners
      yearSelect.addEventListener('change', () => {
        renderCalendar(yearSelect.value, monthSelect.value);
      });

      monthSelect.addEventListener('change', () => {
        renderCalendar(yearSelect.value, monthSelect.value);
      });

      todayBtn.addEventListener('click', () => {
        const today = new Date();
        yearSelect.value = today.getFullYear();
        monthSelect.value = today.getMonth() + 1;
        renderCalendar(today.getFullYear(), today.getMonth() + 1);
      });
    }

    // Render calendar for specific year and month
    function renderCalendar(year, month) {
      const calendarGrid = document.getElementById('calendarGrid');
      const eventList = document.getElementById('eventList');
      calendarGrid.innerHTML = '';
      eventList.innerHTML = '<h3>Perayaan & Hari Besar</h3>';

      // Add weekday headers
      const weekdays = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
      weekdays.forEach(day => {
        const dayElement = document.createElement('div');
        dayElement.className = 'day weekday';
        dayElement.textContent = day;
        calendarGrid.appendChild(dayElement);
      });

      // Get first day of month and total days
      const firstDay = new Date(year, month - 1, 1).getDay();
      const daysInMonth = new Date(year, month, 0).getDate();

      // Add empty cells for days before first day of month
      for (let i = 0; i < firstDay; i++) {
        const emptyCell = document.createElement('div');
        emptyCell.className = 'day';
        calendarGrid.appendChild(emptyCell);
      }

      // Add days of month
      for (let day = 1; day <= daysInMonth; day++) {
        const dayElement = document.createElement('div');
        dayElement.className = 'day';
        dayElement.textContent = day;

        // Check for holidays
        const monthKey = String(month);
        const monthData = calendarData[year] ? calendarData[year][monthKey] : null;
        if (monthData && monthData[day] && monthData[day].events.length > 0) {
          dayElement.classList.add('holiday');
          dayElement.title = monthData[day].events.join(', ');
        }

        // Highlight today
        const today = new Date();
        if (year === today.getFullYear() && month === today.getMonth() + 1 && day === today.getDate()) {
          dayElement.style.border = '2px solid #38bdf8';
          dayElement.style.fontWeight = 'bold';
        }

        calendarGrid.appendChild(dayElement);
      }

      // Display events for the month
      let hasEvents = false;
      const monthKey = String(month);
      if (calendarData[year] && calendarData[year][monthKey]) {
        for (const day in calendarData[year][monthKey]) {
          if (calendarData[year][monthKey][day].events.length > 0) {
            hasEvents = true;
            const eventItem = document.createElement('div');
            const eventMonthName = document.getElementById('monthSelect').options[month - 1].textContent;
            eventItem.innerHTML = `
              <strong>${day} ${eventMonthName}:</strong> ${calendarData[year][monthKey][day].events.join(', ')}
            `;
            eventList.appendChild(eventItem);
          }
        }
      }

      if (!hasEvents) {
        eventList.innerHTML += '<p>Tidak ada perayaan atau hari besar pada bulan ini.</p>';
      }
    }
  </script>
</body>
</html>
